<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hospital | LifeLine Route</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <header>
    <p><a class="back-link" href="index.html">&larr; Back to roles</a></p>
    <h1>Hospital</h1>
    <p>See the incoming ambulance and keep your bed counts up to date.</p>
  </header>

  <main>
    <section class="panel hospital-panel">
      <h2>Incoming ambulance</h2>
      <div id="incomingBox"></div>
    </section>

    <section class="panel hospital-panel map-panel">
      <h2>Live map</h2>
      <div id="map" class="map"></div>
    </section>

    <section class="panel hospital-panel">
      <h2>Beds by hospital</h2>
      <p class="muted">Changes are saved in this browser and used by the ambulance page.</p>
      <div class="table-scroll">
        <table class="bed-table">
          <thead>
            <tr>
              <th>Hospital</th>
              <th>Specialities</th>
              <th>ICU</th>
              <th>Emergency</th>
              <th>General</th>
            </tr>
          </thead>
          <tbody id="hospitalRows"></tbody>
        </table>
      </div>
      <p><button class="action secondary" id="resetBeds">Reset beds to start values</button></p>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/data.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/trip.js"></script>
  <script src="js/map.js"></script>
  <script src="js/hospital.js"></script>
</body>
</html>
